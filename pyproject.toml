[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brainshtorm"
version = "0.1.0"
description = "Runet niche analyzer MVP"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.36",
]

[project.scripts]
brainshtorm = "brainshtorm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
